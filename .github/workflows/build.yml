name: Build and Publish Docker Image

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  pull_request:

  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: python-research-env

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha
            type=ref,event=tag

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (load locally)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: local-test:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run --rm local-test:latest python - <<'PYTHON'
          import sys

          import numpy
          import scipy
          import pandas
          import matplotlib
          import seaborn
          import sklearn

          import MDAnalysis
          import mdtraj

          import Bio
          import rdkit

          import openbabel

          import gemmi
          import freesasa

          import networkx

          import plotly

          import tqdm

          import joblib

          import numba

          import parmed

          print("="*60)
          print("Python :", sys.version)
          print("MDAnalysis :", MDAnalysis.__version__)
          print("MDTraj :", mdtraj.__version__)
          print("RDKit OK")
          print("AmberTools ParmEd OK")
          print("All imports passed.")
          print("="*60)
          PYTHON

      - name: Build and push to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
